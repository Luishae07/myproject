name: Build Nexus unsigned IPA

on:
  workflow_dispatch: {}
  push:
    paths:
      - "Nexus-iOS/**"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Nexus-iOS

    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode
        # /Applications/Xcode.app is a symlink to whatever GitHub set as the
        # runner's *default* Xcode, which is not necessarily the newest one
        # actually installed -- explicitly pick the highest-versioned
        # Xcode_*.app so the real iOS 26 SDK (with the Liquid Glass APIs)
        # is what actually gets used.
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -switch "$LATEST"

      - name: xcodebuild version
        run: xcodebuild -version

      # No signing at all -- iLoader (or any AltStore-style sideloader) does
      # its own signing on install, so CI just needs to produce the raw
      # unsigned .app payload. This sidesteps every free-account
      # provisioning/certificate problem entirely.
      - name: Build unsigned archive
        run: |
          xcodebuild -project Nexus.xcodeproj \
            -scheme Nexus \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            clean build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -print -quit)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Nexus-unsigned.ipa Payload
          ls -la Nexus-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-unsigned-ipa
          path: Nexus-iOS/Nexus-unsigned.ipa
          retention-days: 14
