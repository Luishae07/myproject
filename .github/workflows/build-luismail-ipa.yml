name: Build Luismail unsigned IPA

on:
  workflow_dispatch: {}
  push:
    paths:
      - "Luismail-iOS/**"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: Luismail-iOS

    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: xcodebuild version
        run: xcodebuild -version

      # No signing at all -- iLoader (or any AltStore-style sideloader) does
      # its own signing on install, so CI just needs to produce the raw
      # unsigned .app payload. This sidesteps every free-account
      # provisioning/certificate problem entirely.
      - name: Build unsigned archive
        run: |
          xcodebuild -project Luismail.xcodeproj \
            -scheme Luismail \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            clean build

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -print -quit)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Luismail-unsigned.ipa Payload
          ls -la Luismail-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luismail-unsigned-ipa
          path: Luismail-iOS/Luismail-unsigned.ipa
          retention-days: 14
