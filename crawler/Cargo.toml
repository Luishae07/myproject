[package]
name = "youtube-crawler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "youtube-crawler"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
